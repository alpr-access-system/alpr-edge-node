services:
  pipeline:
    build: 
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: alpr_pipeline
    restart: always
    volumes:
      - ./pipeline:/app # Sincroniza cambios en desarrollo sin reiniciar
      - ./data:/app/data # Montar carpeta data para la DB SQLite
    # Configuración para usar dispositivos (cámara) en Docker (Linux/WSL)
    # Si la cámara en Windows no conecta directo, puede requerir configuraciones adicionales 
    # de red RTSP o uso de apps como IP Webcam
#    devices:
#      - /dev/video0:/dev/video0
    environment:
      - PYTHONUNBUFFERED=1
      - CAMERA_SOURCE=${CAMERA_SOURCE:-0} # Se toma del archivo .env (ver .env.example)

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: alpr_dashboard
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app
      # Ignoramos la carpeta node_modules local para usar la del contenedor
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda a que el hot-reload de React funcione bien en Windows
